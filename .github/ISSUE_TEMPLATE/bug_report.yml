name: Bug report
description: Something doesn't work the way it should
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.

        Please sanitise any client/employer names, subscription IDs, internal
        domain names, or resource identifiers in pasted plan output — tfreport
        has no idea what's sensitive in your environment.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What were you trying to do, and what did you see instead?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command(s) you ran and a minimal plan fixture that triggers the issue. Smallest reproduction wins.
      placeholder: |
        terraform show -json plan.out > plan.show.json
        tfreport --plan-file plan.show.json --target github-pr-body
        # Observed output:
        # ...
      render: shell
    validations:
      required: true

  - type: input
    id: tfreport-version
    attributes:
      label: tfreport version
      description: Output of `tfreport --version`.
      placeholder: "0.0.4"
    validations:
      required: true

  - type: input
    id: terraform-version
    attributes:
      label: Terraform / OpenTofu version
      placeholder: "terraform 1.9.0 / tofu 1.7.3"

  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: "linux/amd64, macOS/arm64, windows/amd64, …"

  - type: textarea
    id: config
    attributes:
      label: Relevant .tfreport.yml (if any)
      description: Paste the config file contents if it's involved in the bug.
      render: yaml
